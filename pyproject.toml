[project]
name = "gov-finance-ml"
version = "1.0.0"
description = "PySpark ML pipeline for US state government finances: revenue forecasting, peer-state clustering and anomaly detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash>=4.4.1",
    "dash-ag-grid>=35.3.0",
    "dash-mantine-components>=2.8.0",
    "mlflow>=3.16.1",
    "numpy>=1.26",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyspark>=4.0,<5",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
