# ============================================================
#  US State Government Finance — ML Pipeline configuration
#  All paths are relative to the project root.
# ============================================================

spark:
  app_name: "gov_finance_ml"
  master: "local[*]"
  driver_memory: "2g"            # ~1,000 rows: a small driver is plenty
  shuffle_partitions: 4          # small dataset -> few partitions is faster

paths:
  raw_csv: "data/raw/finance.csv"
  output_dir: "output"           # parquet tables, saved models, reports

mlflow:
  # Local SQLite database for runs, metrics and the model registry.
  # View it with:  uv run mlflow ui --backend-store-uri sqlite:///mlflow.db
  tracking_uri: "sqlite:///mlflow.db"
  artifact_dir: "mlartifacts"     # saved models, reports, plots
  experiment_name: "us_gov_finance_ml"
  registered_model_name: "state_revenue_forecaster"

monitoring:
  # Feature drift = |mean(latest year) - mean(earlier years)| / std(earlier years).
  # Above this value a feature has shifted by more than half a standard deviation.
  drift_threshold: 0.5

dashboard:
  host: "127.0.0.1"
  port: 8050

data:
  # Rows that are not a single state (national aggregate) must not be
  # mixed with state rows, or they dominate every model.
  exclude_states: ["UNITED STATES"]

# ---- Model A: next-year revenue forecaster (Spark ML RandomForestRegressor) ----
forecaster:
  # General revenue = taxes + federal aid + charges. Total revenue also
  # includes pension-fund investment returns, which are not forecastable.
  target: "totals_general_revenue"
  # Rows whose *target* year is >= test_start_year are held out as test.
  # Rows whose target year is >= validation_start_year (but < test) are
  # used to pick hyper-parameters. Everything before is training data.
  validation_start_year: 2015
  test_start_year: 2017
  seed: 42
  param_grid:
    max_depth: [3, 5]
    num_trees: [50, 100]

# ---- Model B: peer-state clustering (Spark ML KMeans) ----
clustering:
  profile_years: 5               # average each state's last N years
  # k=2 only splits the country in half; k>6 creates 2-3 state groups whose
  # median is not a meaningful benchmark. Silhouette picks the best k in between.
  k_range: [3, 4, 5, 6]
  seed: 42
  features:                      # structure of the budget, not its size
    - "welfare_share"
    - "education_share"
    - "health_share"
    - "highways_share"
    - "police_share"
    - "corrections_share"
    - "debt_to_revenue_ratio"
    - "intergovernmental_dependency"
    - "tax_share_of_general_revenue"
    - "insurance_trust_share_of_revenue"

# ---- Model C: anomaly detection (robust z-score on YoY changes) ----
anomaly:
  # 3.5 is the textbook cut-off, but year-over-year changes in public
  # finances are heavy-tailed: 3.5 flags ~14% of state-years, too many to
  # audit. 5.0 keeps the list to the ~6% most extreme cases.
  z_threshold: 5.0
  features:
    - "totals_revenue_growth"
    - "totals_expenditure_growth"
    - "totals_capital_outlay_growth"
    - "totals_debt_at_end_of_fiscal_year_growth"
    - "details_interest_on_general_debt_growth"
    - "details_miscellaneous_general_revenue_growth"
